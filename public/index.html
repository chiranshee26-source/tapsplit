<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#13a073" />
  <title>TapSplit</title>
  <meta name="description" content="Split a restaurant bill by what each person actually ordered." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    // Apply a saved theme before the page paints, so it doesn't flash.
    try { if (localStorage.getItem('tapsplit:theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand" data-link><span class="logo">⟂</span> TapSplit</a>
    <span class="tag">a Splitwise feature concept</span>
    <button class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode">🌙</button>
  </header>
  <main id="app"></main>
  <div id="toast" class="toast" hidden></div>
  <script src="/vendor/qrcode.js"></script>
  <script src="/app.js"></script>
</body>
</html>
